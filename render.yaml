services:
  - type: web
    name: spectre-osint
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 4 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: HIBP_USER_AGENT
        value: "SPECTRE-OSINT-Platform"
      - key: HIBP_API_KEY
        sync: false
